<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="复扫雷 Complexweeper — 扫雷，但雷是复数" />
    <meta name="theme-color" content="#C0C0C0" />
    <link rel="icon" type="image/png" href="assets/icon-32.png" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>复扫雷 Complexweeper</title>
    <style>
      :root {
        --btnface: #c0c0c0;
        --hilight: #dfdfdf;
        --shadow: #808080;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--btnface);
        font-family: 'Microsoft YaHei UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 12px max(8px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
        -webkit-user-select: none;
        user-select: none;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
        max-width: min(100%, 720px);
        margin-bottom: 12px;
      }
      #toolbar .group {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 100%;
        gap: 4px;
        padding: 0 6px;
        border-left: 1px solid var(--shadow);
        border-right: 1px solid var(--hilight);
      }
      #toolbar .group:first-child {
        border-left: none;
      }
      #toolbar .group:last-child {
        border-right: none;
      }
      .tool {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: 13px/1 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
        padding: 5px 10px;
        background: var(--btnface);
        border: 2px solid;
        border-color: var(--hilight) var(--shadow) var(--shadow) var(--hilight);
        cursor: pointer;
        white-space: nowrap;
        color: inherit;
        text-decoration: none;
      }
      .tool:active,
      .tool.active {
        border-color: var(--shadow) var(--hilight) var(--hilight) var(--shadow);
      }
      button:focus-visible,
      a.tool:focus-visible,
      summary:focus-visible,
      #board-viewport:focus-visible {
        outline: 2px solid #000080;
        outline-offset: 2px;
      }
      #board-viewport {
        width: fit-content;
        max-width: 100%;
        overflow: auto;
      }
      #board {
        display: block;
        touch-action: pan-x pan-y pinch-zoom;
        image-rendering: pixelated;
        -webkit-touch-callout: none;
      }
      #fatal {
        color: #a00;
        margin-top: 16px;
        font-size: 14px;
        white-space: pre-wrap;
      }
      /* ---- 对话框 ---- */
      .dlg-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 12px;
        overscroll-behavior: contain;
      }
      body:has(.dlg-overlay) {
        overflow: hidden;
      }
      .dlg-box {
        background: #fff;
        border: 1px solid #404040;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
        width: min(100%, 420px);
        min-width: 0;
        max-height: calc(100vh - 24px);
        max-height: calc(100dvh - 24px);
        display: flex;
        flex-direction: column;
      }
      .dlg-title {
        background: #000080;
        color: #fff;
        font-size: 13px;
        font-weight: bold;
        padding: 4px 8px;
        flex: none;
      }
      .dlg-body {
        padding: 14px 16px;
        font-size: 13px;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        -webkit-user-select: text;
        user-select: text;
      }
      .dlg-text {
        white-space: pre-wrap;
        line-height: 1.7;
        margin-bottom: 14px;
        overflow-wrap: anywhere;
      }
      .dlg-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .dlg-row label {
        width: 64px;
        flex: none;
      }
      .dlg-row input,
      .dlg-row select {
        width: 70px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.4;
        min-height: 32px;
        padding: 2px 4px;
        border: 2px solid;
        border-color: var(--shadow) var(--hilight) var(--hilight) var(--shadow);
      }
      .dlg-row select {
        width: auto;
        max-width: 100%;
      }
      .dlg-hint {
        color: #606060;
      }
      .dlg-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        margin: 4px 0 6px;
      }
      .dlg-grid .dlg-row label {
        flex: 1;
        width: auto;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .dlg-grid .dlg-row input {
        flex: 0 0 70px;
      }
      .dlg-row:has(.dlg-error) {
        flex-wrap: wrap;
      }
      .dlg-error {
        color: #a00;
        min-height: 18px;
        font-size: 12px;
      }
      .dlg-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 12px;
      }
      .dlg-btn {
        min-width: 88px;
        padding: 5px 12px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.2;
        background: var(--btnface);
        border: 2px solid;
        border-color: var(--hilight) var(--shadow) var(--shadow) var(--hilight);
        cursor: pointer;
      }
      .dlg-btn:active {
        border-color: var(--shadow) var(--hilight) var(--hilight) var(--shadow);
      }
      .mode-menu {
        position: relative;
        max-width: 100%;
      }
      .mode-menu summary {
        list-style: none;
        white-space: normal;
        line-height: 1.4;
      }
      .mode-menu summary::-webkit-details-marker {
        display: none;
      }
      .mode-menu summary::after {
        content: ' ▾';
        margin-left: 4px;
      }
      .mode-options {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        background: var(--btnface);
        border: 1px solid var(--shadow);
        box-shadow: 2px 2px 0 #808080;
        min-width: 180px;
      }
      .mode-options .tool {
        justify-content: flex-start;
      }
      .mode-menu:last-child .mode-options {
        left: auto;
        right: 0;
      }
      @media (max-width: 640px) {
        #toolbar .group {
          border: none;
          padding: 0 2px;
        }
      }
      @media (max-width: 640px), (pointer: coarse) {
        .tool,
        .dlg-btn,
        .dlg-row input,
        .dlg-row select {
          min-height: 44px;
        }
        .tool,
        .dlg-btn {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="group">
        <button class="tool" id="btn-new" title="F2">开局</button>
      </div>
      <div class="group">
        <details class="mode-menu" id="menu-complex">
          <summary class="tool">圆复数模式</summary>
          <div class="mode-options">
            <button class="tool" id="btn-beginner">初级 · 9×9 · 10 雷</button>
            <button class="tool" id="btn-intermediate">中级 · 16×16 · 40 雷</button>
            <button class="tool" id="btn-expert">高级 · 30×16 · 99 雷</button>
            <button class="tool" id="btn-scores">最高分纪录</button>
            <button class="tool" id="btn-custom">自定义…</button>
          </div>
        </details>
        <details class="mode-menu" id="menu-hyper">
          <summary class="tool">双曲复数模式（闵可夫斯基模式）</summary>
          <div class="mode-options">
            <button class="tool" id="btn-hyper-beginner">初级 · 9×9 · 10 雷</button>
            <button class="tool" id="btn-hyper-intermediate">中级 · 16×16 · 40 雷</button>
            <button class="tool" id="btn-hyper-expert">高级 · 30×16 · 99 雷</button>
            <button class="tool" id="btn-hyper-scores">最高分纪录</button>
            <button class="tool" id="btn-hyper-custom">自定义…</button>
          </div>
        </details>
      </div>
      <div class="group">
        <button class="tool" id="btn-zoom-1">100%</button>
        <button class="tool" id="btn-zoom-2">200%</button>
        <button class="tool" id="btn-zoom-3">300%</button>
      </div>
      <div class="group">
        <button class="tool" id="btn-flag-mode" title="切换点按或左键为插旗">🚩 插旗模式</button>
        <button class="tool" id="btn-sound" title="切换踩雷、通关和计时音效">音效：开</button>
      </div>
      <div class="group">
        <button class="tool" id="btn-help">玩法</button>
        <button class="tool" id="btn-about">关于</button>
        <a class="tool" id="link-github" href="https://github.com/miofelix/complexweeper-web" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库（在新标签页打开）">GitHub ↗</a>
      </div>
    </div>
    <div id="board-viewport" role="region" aria-label="雷区" tabindex="0">
      <canvas id="board" aria-label="复扫雷雷区"></canvas>
    </div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
